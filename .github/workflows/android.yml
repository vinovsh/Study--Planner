name: Build Study Bloom APK
on:
  push:
    branches: [study-planer]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    if: ${{ !contains(github.event.head_commit.message, '[qa-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test offline planner logic
        run: npm test
      - name: Check React Native JSX
        run: node -e "const babel=require('@babel/core'); babel.transformFileSync('App.js'); for (const f of require('fs').readdirSync('src').filter(f=>f.endsWith('.js'))) babel.transformFileSync('src/'+f)"
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - uses: actions/cache@v4
        with:
          path: android/app/debug.keystore
          key: study-bloom-sideload-key-v1
      - name: Prepare sideload signing key
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Study Bloom Development,O=Study Bloom,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Keep signing key for subsequent APK updates
        uses: actions/cache/save@v4
        with:
          path: android/app/debug.keystore
          key: study-bloom-sideload-key-v1
      - name: Build standalone APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verify APK and offline permissions
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions android/app/build/outputs/apk/release/app-release.apk > /tmp/permissions.txt
          cat /tmp/permissions.txt
          if grep -q android.permission.INTERNET /tmp/permissions.txt; then echo 'Unexpected internet permission'; exit 1; fi
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/StudyBloom.apk
          sha256sum artifacts/StudyBloom.apk > artifacts/StudyBloom.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: StudyBloom-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
      - name: Enable hardware acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - name: Check happy hero and native pickers offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 test/hero-smoke.py
            python3 test/picker-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-screen-checks
          path: smoke-results/
