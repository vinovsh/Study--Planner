name: Verify native pickers in built APK
on:
  push:
    branches: [study-planer]
    paths:
      - .github/workflows/verify-pickers.yml
      - test/picker-smoke.py
permissions:
  contents: read
  actions: read
jobs:
  pickers:
    if: contains(github.event.head_commit.message, '[qa-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: StudyBloom-APK
          run-id: '38737225921'
          github-token: ${{ github.token }}
          path: artifacts
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r artifacts/StudyBloom.apk
            adb shell svc wifi disable
            adb shell svc data disable
            python3 test/picker-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-picker-checks
          path: smoke-results/
